services:
  - type: web
    name: mohanmishra-v2
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MOCK_PAYMENT_SECRET
        generateValue: true
      - key: MOCK_WEBHOOK_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 7d
      - key: AUTO_SEED
        value: "1"
      - key: PAYMENT_PROVIDER
        value: mock
      - key: OTP_PROVIDER
        value: mock
      - key: CALL_PROVIDER
        value: mock
      - key: EXPOSE_DEV_OTP
        value: "1"
      - key: CORS_ORIGINS
        value: "*"
      - key: DB_PATH
        value: data/mohanmishra.db
      - key: UPLOAD_DIR
        value: uploads
# Free plan: filesystem is ephemeral — SQLite DB and uploads reset on redeploy/restart (demo re-seeds automatically).
